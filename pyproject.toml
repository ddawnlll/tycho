[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tycho"
version = "0.1.0"
description = "Tycho research package (DEV)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "arch",
    "statsmodels",
    "nautilus_trader==1.221.0",
]

[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
